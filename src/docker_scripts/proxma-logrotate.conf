# Nginx access and error logs - high volume, size-based rotation
# Uses the official nginx log rotation method: move file, then USR1 signal
# Runs via cron every 15 minutes, rotates when size exceeds 50M
/var/proxma/logs/nginx_access.log
/var/proxma/logs/nginx_error.log {
    size 50M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    create 0644 nginx nginx
    sharedscripts
    postrotate
        # Use /var/run/nginx.pid to match nginx.conf pid directive
        # The -USR1 signal tells nginx master to reopen log files
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
        fi
    endscript
}

# Other logs - daily rotation, these can use copytruncate as they're not nginx
/var/proxma/logs/letsencrypt.log
/var/proxma/logs/cloudflare_ip_updates.log
/var/proxma/logs/logrotate.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    size 10M
    copytruncate
    dateext
}