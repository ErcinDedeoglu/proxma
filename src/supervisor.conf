[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/var/log/nginx.stdout.log
stderr_logfile=/var/log/nginx.stderr.log

[program:proxy-manager]
command=/usr/local/bin/proxy-manager
autorestart=true
stdout_logfile=/var/log/proxy-manager.stdout.log
stderr_logfile=/var/log/proxy-manager.stderr.log

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
stdout_logfile=/var/log/cron.stdout.log
stderr_logfile=/var/log/cron.stderr.log