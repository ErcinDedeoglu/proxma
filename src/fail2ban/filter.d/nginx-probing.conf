[Definition]
failregex = ^<HOST>.*"GET .*HTTP.*" (403|404) \d+
            ^<HOST>.*"(HEAD|OPTIONS) \/.*HTTP.*" (403|404|405|401)
            ^<HOST>.*"\/\.git\/.* 
            ^<HOST>.*"\/\.env.*
            ^<HOST>.*"\/wp-includes.*
# MCP Streamable HTTP must 404 unknown sessions (and 409 if GET SSE is already open).
# 403 with no upstream is nginx-deny at http{} — counting it re-bans after unban.
ignoreregex = ^<HOST> .*"GET /mcp(?:/|\?|\s).*HTTP/[\d.]+" (404|409) 
              ^<HOST> .*HTTP/[\d.]+" 403 \d+ .* Upstream: -
