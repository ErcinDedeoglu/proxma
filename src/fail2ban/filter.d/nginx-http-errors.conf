[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD).*" (4|5)\d\d \d+ .*
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S
# MCP session 404/409, WS Upgrade Required, and this jail's own nginx-deny 403s
# (retry storm after a probing ban). Do not ignore origin 403 (Upstream: 403).
ignoreregex = ^<HOST> .*"(GET|POST) /mcp(?:/|\?|\s).*HTTP/[\d.]+" (404|409) 
              ^<HOST> .*"GET .*HTTP/[\d.]+" 426 
              ^<HOST> .*HTTP/[\d.]+" 403 \d+ .* Upstream: -
