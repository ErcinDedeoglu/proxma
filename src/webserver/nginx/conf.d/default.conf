server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    
    # Self-signed certificate
    ssl_certificate /var/proxma/ssl/default.crt;
    ssl_certificate_key /var/proxma/ssl/default.key;
    
    server_name _;
    root /var/www/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}