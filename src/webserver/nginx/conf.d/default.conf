server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    
    # Enable HTTP/2
    http2 on;
    
    # Self-signed certificate
    ssl_certificate /var/proxma/ssl/default.fullchain.crt.pem;
    ssl_certificate_key /var/proxma/ssl/default.privkey.key.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Prevent caching entirely
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT" always;
    
    # Prevent browsers from automatically redirecting to HTTPS
    add_header Strict-Transport-Security "max-age=0" always;
    
    # Explicitly tell browsers not to upgrade to HTTPS
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    server_name _;
    root /var/www/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
